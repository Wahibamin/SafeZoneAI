name: safezone_mobile
description: SafeZone AI Mobile - Offline-First Arabic RTL Safety & PPE Compliance Monitor with Dynamic LiteRT/TFLite Model Switching.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  camera: ^0.11.0+2
  sqflite: ^2.3.3+1
  path: ^1.9.0
  path_provider: ^2.1.4
  file_picker: ^8.1.2
  crypto: ^3.0.5
  permission_handler: ^11.3.1
  shared_preferences: ^2.3.2
  intl: 0.20.2
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  sqflite_common_ffi: ^2.3.3

flutter:
  uses-material-design: true
  assets:
    - assets/models/sample_manifest_v4.json
    - docs/safezone_mobile_schema.sql
